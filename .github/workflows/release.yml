name: Publication

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  velopack:
    name: Velopack package
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Read the version and notes
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if (-not $tag.StartsWith('v')) {
            Write-Error "Unexpected tag: $tag"
            exit 1
          }
          $version = $tag.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') {
            Write-Error "Invalid version: $version"
            exit 1
          }
          $changelogPath = Join-Path (Get-Location) 'CHANGELOG.md'
          if (-not (Test-Path -LiteralPath $changelogPath)) {
            Write-Error 'CHANGELOG.md was not found.'
            exit 1
          }
          $changelog = Get-Content -LiteralPath $changelogPath -Raw -Encoding utf8
          $escaped = [regex]::Escape($version)
          $chunks = [regex]::Split($changelog, '(?m)^(?=## )')
          $section = $chunks | Where-Object { $_ -match "^## \[$escaped\]" } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($section)) {
            Write-Error "No CHANGELOG section for $version. Add « ## [$version] » before tagging."
            exit 1
          }
          $kept = foreach ($line in ($section -split '\r?\n')) {
            if ($line -match '^\[[^\]]+\]:\s+\S') { continue }
            $line
          }
          $notes = (($kept -join "`n").Trim()) + "`n"
          if ([string]::IsNullOrWhiteSpace($notes)) {
            Write-Error "The CHANGELOG section for $version is empty."
            exit 1
          }
          $notesPath = Join-Path (Get-Location) 'release-notes.md'
          $utf8 = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($notesPath, $notes, $utf8)
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version" -Encoding utf8NoBOM
          Add-Content -Path $env:GITHUB_OUTPUT -Value "notes=$notesPath" -Encoding utf8NoBOM
          Write-Host "Version: $version"

      - name: Test
        run: dotnet test Mixdeck.slnx -c Release -nologo

      - name: Publish the application
        run: dotnet publish src/Mixdeck.App/Mixdeck.App.csproj -c Release -r win-x64 --self-contained "-p:Version=${{ steps.version.outputs.version }}" -o publish

      - name: Restore the vpk tool
        run: dotnet tool restore

      - name: Download the previous release (deltas)
        id: download
        continue-on-error: true
        run: dotnet tool run vpk -- download github --repoUrl https://github.com/Anarchiejs/Mixdeck --token "${{ secrets.GITHUB_TOKEN }}"

      - name: No delta base
        if: steps.download.outcome == 'failure'
        shell: pwsh
        run: Write-Host "No usable previous release. The package will be full, without a delta."

      # Azure Trusted Signing (docs/SIGNATURE.md) runs only when the repository variable
      # AZURE_SIGNING is "true" and the AZURE_* secrets exist. Otherwise the package is unsigned (SmartScreen warning).
      - name: Prepare signing
        id: signing
        if: vars.AZURE_SIGNING == 'true'
        shell: pwsh
        run: |
          $metadata = @{
            Endpoint = '${{ vars.AZURE_SIGNING_ENDPOINT }}'
            CodeSigningAccountName = '${{ vars.AZURE_SIGNING_ACCOUNT }}'
            CertificateProfileName = '${{ vars.AZURE_SIGNING_PROFILE }}'
          } | ConvertTo-Json
          $path = Join-Path $env:RUNNER_TEMP 'signing.json'
          Set-Content -LiteralPath $path -Value $metadata -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "args=--azureTrustedSignFile `"$path`"" -Encoding utf8NoBOM

      - name: Pack
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: dotnet tool run vpk -- pack --packId MixdeckApp --packVersion ${{ steps.version.outputs.version }} --packDir publish --mainExe Mixdeck.exe --runtime win-x64 --packTitle Mixdeck --icon src/Mixdeck.App/Assets/Mixdeck.ico ${{ steps.signing.outputs.args }}

      - name: Upload to GitHub Releases
        run: dotnet tool run vpk -- upload github --repoUrl https://github.com/Anarchiejs/Mixdeck --publish --releaseName "Mixdeck ${{ steps.version.outputs.version }}" --tag v${{ steps.version.outputs.version }} --releaseNotes "${{ steps.version.outputs.notes }}" --token "${{ secrets.GITHUB_TOKEN }}"

  macos:
    name: macOS package
    needs: velopack
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test Mixdeck.Portable.slnx -c Release -nologo

      - name: Package
        run: bash build/pack.sh --skip-tests --require-vpk --version ${{ needs.velopack.outputs.version }}

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(artifacts/*.tar.gz artifacts/*.nupkg artifacts/RELEASES)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release files in artifacts/." >&2
            exit 1
          fi
          gh release upload "v${{ needs.velopack.outputs.version }}" "${files[@]}" --clobber

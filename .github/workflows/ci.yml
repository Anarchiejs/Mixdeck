name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Mixdeck.slnx

      - name: Build
        run: dotnet build Mixdeck.slnx -c Release -nologo

      - name: Test
        run: dotnet test Mixdeck.slnx -c Release -nologo --logger "console;verbosity=minimal" --logger trx --results-directory TestResults

      # UI tests (FlaUI) need an interactive desktop session and do not pass on GitHub-hosted runners.
      # They stay in the tree for a local run with MIXDECK_UI_TESTS=1. They are not part of CI.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**/*.trx"
          if-no-files-found: warn

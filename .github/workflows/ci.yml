name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Compilation et tests
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer le SDK .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurer
        run: dotnet restore Mixdeck.slnx

      - name: Compiler
        run: dotnet build Mixdeck.slnx -c Release -nologo

      - name: Tester
        run: dotnet test Mixdeck.slnx -c Release -nologo --logger "console;verbosity=minimal" --logger trx --results-directory TestResults

      # Tests d'interface (FlaUI) : le runner Windows a une session de bureau. Ne bloquent pas la CI tant qu'ils
      # n'ont pas fait leurs preuves sur GitHub.
      - name: Tester l'interface
        continue-on-error: true
        env:
          MIXDECK_UI_TESTS: "1"
        run: dotnet test tests/Mixdeck.UiTests -c Release -nologo --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=ui.trx" --results-directory TestResults
      - name: Publier les résultats de tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: "**/TestResults/**/*.trx"
          if-no-files-found: warn

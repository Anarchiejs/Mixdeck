name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Mixdeck.slnx

      - name: Build
        run: dotnet build Mixdeck.slnx -c Release -nologo

      - name: Test
        run: dotnet test Mixdeck.slnx -c Release -nologo --logger "console;verbosity=minimal" --logger trx --results-directory TestResults

      # UI tests (FlaUI) need an interactive desktop session and do not pass on GitHub-hosted runners.
      # They stay in the tree for a local run with MIXDECK_UI_TESTS=1. They are not part of CI.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: "**/TestResults/**/*.trx"
          if-no-files-found: warn

  linux:
    name: Linux build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Virtual display and AppImage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-6 libxtst6 squashfs-tools
          Xvfb :99 -screen 0 1280x1024x24 >/tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test Mixdeck.Portable.slnx -c Release -nologo --logger "console;verbosity=minimal"

      - name: Self-check
        run: dotnet run --project src/Mixdeck.Desktop/Mixdeck.Desktop.csproj -c Release -- --self-check

      - name: Package
        run: bash build/pack.sh --skip-tests --require-vpk --version 0.1.0

      - name: Upload packages
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mixdeck-linux
          path: artifacts/*
          if-no-files-found: warn

  macos:
    name: macOS build and test
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test Mixdeck.Portable.slnx -c Release -nologo --logger "console;verbosity=minimal"

      - name: Self-check
        run: dotnet run --project src/Mixdeck.Desktop/Mixdeck.Desktop.csproj -c Release -- --self-check

      - name: Package
        run: bash build/pack.sh --skip-tests --require-vpk --version 0.1.0

      - name: Upload packages
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mixdeck-macos
          path: artifacts/*
          if-no-files-found: warn

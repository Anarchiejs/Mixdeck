name: Bug report
description: Something in Mixdeck does not behave as documented.
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not paste a secret, a token, a crash log that contains personal paths, or a Windows user name.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what Mixdeck did instead.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Windows 11 24H2, Ubuntu 24.04, or macOS 15. Include X11 or Wayland on Linux.
      placeholder: Ubuntu 24.04, X11
    validations:
      required: true
  - type: dropdown
    id: voicemeeter
    attributes:
      label: Voicemeeter edition
      options:
        - Standard
        - Banana
        - Potato
        - Not installed (demo mode)
        - Not applicable (Linux or macOS)
    validations:
      required: true
  - type: dropdown
    id: demo
    attributes:
      label: Does --demo reproduce it?
      options:
        - Yes
        - No
        - Not tried
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: FL Studio only if the bug needs it. Leave device names out if they identify you.
